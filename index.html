<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* =========================
           SKY
           ========================= */

        #sky {
            position: absolute;

            width: 100vw;
            height: auto;

            left: 0;
            top: 50%;
            transform: translateY(-50%);

            image-rendering: pixelated;

            z-index: 0;
        }

        /* =========================
           PIXEL
           ========================= */

        #pixel {
            position: absolute;

            width: 475px;
            height: auto;

            left: 50%;
            top: 5%;

            transform: translateX(-50%);

            image-rendering: pixelated;

            z-index: 1;
        }
    </style>
</head>

<body>

    <img id="sky" src="sky.gif" alt="">
    <img id="pixel" src="pixel.png" alt="Pixel">

</body>
</html>
