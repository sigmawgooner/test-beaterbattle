<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        /* BACKGROUND */
        #sky {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            object-fit: cover;
            object-position: center;

            image-rendering: pixelated;

            z-index: 0;
        }

        /* PIXEL */
        #pixel {
            position: fixed;

            width: 550px;
            height: auto;

            left: 50%;
            top: 3%;

            transform: translateX(-50%);

            image-rendering: pixelated;

            z-index: 1;
        }
    </style>
</head>

<body>

    <img id="sky" src="./sky.gif" alt="">
    <img id="pixel" src="./pixel.png" alt="">

</body>
</html>
