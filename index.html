<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            position: relative;
            background: #000;
        }

        /* =========================
           SKY GIF BACKGROUND
           ========================= */

        #sky {
            position: absolute;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            object-fit: cover;
            object-position: center center;

            image-rendering: pixelated;

            z-index: 0;
        }

        /* =========================
           PIXEL CHARACTER
           ========================= */

        #pixel {
            position: absolute;

            width: 475px;
            height: auto;

            left: 50%;
            top: 6%;

            transform: translateX(-50%);

            image-rendering: pixelated;
            image-rendering: crisp-edges;

            z-index: 1;
        }
    </style>
</head>

<body>

    <!-- Background -->
    <img id="sky" src="sky.gif" alt="">

    <!-- Character -->
    <img id="pixel" src="pixel.png" alt="Pixel">

</body>
</html>
