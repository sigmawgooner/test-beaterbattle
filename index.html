```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-image: url("./sky.gif");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;

            position: relative;
        }

        #pixel {
            position: absolute;

            /* Bigger */
            width: 350px;
            height: auto;

            /* Upper-middle */
            left: 50%;
            top: 18%;

            transform: translateX(-50%);

            /* Keeps pixel art crisp */
            image-rendering: pixelated;
        }
    </style>
</head>

<body>

    <img id="pixel" src="./pixel.png" alt="Pixel">

</body>
</html>
```
